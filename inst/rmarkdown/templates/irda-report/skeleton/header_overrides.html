<!--
  Header/Footer Configuration Script
  
  This script reads YAML metadata and configures page headers/footers.
  
  YAML Options:
    header-left: "Text for left header"
    header-middle: "Text for center header"
    header-right: "Text for right header"
    footer-left: "Text for left footer"
    footer-middle: "Text for center footer"
    footer-right: "Text for right footer"
    page-number-position: "right" | "alternate"
      - "right": Page number always on right (replaces footer-right)
      - "alternate": Book-style - even pages: number on left (replaces footer-left)
                                  odd pages: number on right (replaces footer-right)
-->
<script>
(function() {
  window.PagedConfig = window.PagedConfig || {};
  const priorBefore = window.PagedConfig.before;
  window.PagedConfig.before = async () => {
    try {
      if (priorBefore) await priorBefore();

      // ============================================
      // NORMALISE TOC ANCHORS (non-ASCII headings)
      // pandoc percent-encodes hrefs (e.g. "#%C3%A9l%C3%A9ments") while the
      // element ids keep the raw characters ("éléments"). The CSS
      // target-counter(attr(href), page) then fails to resolve the target and
      // the TOC page number falls back to 0. Decode the hrefs so they match
      // the ids.
      // ============================================
      document.querySelectorAll('a[href^="#"]').forEach(a => {
        const raw = a.getAttribute('href');
        if (!raw || raw.indexOf('%') === -1) return;
        try {
          a.setAttribute('href', '#' + decodeURIComponent(raw.slice(1)));
        } catch (e) {
          /* keep the original href when it cannot be decoded */
        }
      });

      // ============================================
      // READ YAML METADATA FROM META TAGS
      // ============================================
      const getMeta = (name) => {
        const el = document.querySelector('meta[name="' + name + '"]');
        return el ? el.getAttribute('content') : '';
      };
      
      const headerLeft = getMeta('header-left') || '';
      const headerMiddle = getMeta('header-middle') || '';
      const headerRight = getMeta('header-right') || '';
      const footerLeft = getMeta('footer-left') || '';
      const footerMiddle = getMeta('footer-middle') || '';
      const footerRight = getMeta('footer-right') || '';
      const pageNumPosition = getMeta('page-number-position') || 'right';
      
      // Store all values for after hook
      document.body.dataset.headerLeft = headerLeft;
      document.body.dataset.headerMiddle = headerMiddle;
      document.body.dataset.headerRight = headerRight;
      document.body.dataset.footerLeft = footerLeft;
      document.body.dataset.footerMiddle = footerMiddle;
      document.body.dataset.footerRight = footerRight;
      document.body.dataset.pageNumPosition = pageNumPosition;

      // ============================================
      // FOOTNOTE PROCESSING
      // Convert inline footnotes to page-bottom footnotes
      // Usage: <span class="footnote">Footnote text here</span>
      // ============================================
      let footnoteCounter = 0;
      document.querySelectorAll('span.footnote').forEach(fn => {
        footnoteCounter++;
        const ref = document.createElement('sup');
        ref.className = 'footnote-ref';
        ref.textContent = footnoteCounter;
        ref.setAttribute('data-fn-id', footnoteCounter);
        
        fn.setAttribute('data-fn-id', footnoteCounter);
        fn.setAttribute('data-fn-content', fn.innerHTML);
        fn.className = 'footnote-hidden';
        fn.style.display = 'none';
        
        fn.parentNode.insertBefore(ref, fn);
      });
    } catch (e) {
      console.error('Before hook error:', e);
    }

    // ============================================
    // FRONT PAGE IMAGES (Bandeau + Logo + Image couverture)
    // ============================================
    const frontPage = document.querySelector('.front-page');
    if (frontPage) {
      const assets = window.IRDA_ASSETS || {};

      // Add bandeau droit
      const bandeau = document.createElement('div');
      bandeau.className = 'bandeau-droit';
      const bandeauSrc = assets.bandeau || 'bandeaugauche.png';
      bandeau.style.backgroundImage = "url('" + bandeauSrc + "')";
      frontPage.appendChild(bandeau);

      // Add logo IRDA
      const logo = document.createElement('img');
      logo.src = assets.logo || 'logo.png';
      logo.className = 'logo-irda';
      logo.alt = 'Logo IRDA';
      frontPage.appendChild(logo);

      // Add image couverture
      const imgCouverture = document.createElement('img');
      imgCouverture.src = assets.cover || 'image_couverture.png';
      imgCouverture.className = 'image-couverture';
      imgCouverture.alt = 'Image de couverture';
      frontPage.appendChild(imgCouverture);
    }

    // ============================================
    // PAGE BREAK HANDLING
    // ============================================
    document.querySelectorAll('[data-break-before="recto"]').forEach(el => {
      el.setAttribute('data-break-before', 'page');
    });

    document.querySelectorAll('.level1').forEach(el => {
      el.classList.add('level1-noreset');
      el.classList.remove('level1');
    });
    document.querySelectorAll('.chapter').forEach(el => {
      el.classList.remove('chapter');
    });

    document.querySelectorAll('.section-break [data-break-before]').forEach(el => {
      el.setAttribute('data-break-before', 'avoid');
    });

    // ============================================
    // COUNTER RESET PREVENTION
    // ============================================
    document.querySelectorAll('[data-counter-page-reset]').forEach(el => {
      el.removeAttribute('data-counter-page-reset');
      el.style.counterReset = 'none';
    });
    document.querySelectorAll('[data-counter-reset]').forEach(el => {
      const val = el.getAttribute('data-counter-reset');
      if (val && val.indexOf('page') === 0) {
        el.removeAttribute('data-counter-reset');
        el.style.counterReset = 'none';
      }
    });
  };

  const priorAfter = window.PagedConfig.after;
  window.PagedConfig.after = async (flow) => {
    try {
      if (priorAfter) await priorAfter(flow);

      // ============================================
      // HEADER AND FOOTER CONTENT
      // Sets all header/footer positions from YAML
      // Page number replaces footer-left or footer-right based on position
      // ============================================
      const headerLeft = document.body.dataset.headerLeft || '';
      const headerMiddle = document.body.dataset.headerMiddle || '';
      const headerRight = document.body.dataset.headerRight || '';
      const footerLeft = document.body.dataset.footerLeft || '';
      const footerMiddle = document.body.dataset.footerMiddle || '';
      const footerRight = document.body.dataset.footerRight || '';
      const pageNumPosition = document.body.dataset.pageNumPosition || 'right';
      
      document.querySelectorAll('.pagedjs_page').forEach((page, index) => {
        // Skip first page (cover) - it has no headers/footers
        if (index === 0) return;
        
        // Header elements
        const headerLeftEl = page.querySelector('.pagedjs_margin-top-left .pagedjs_margin-content');
        const headerCenterEl = page.querySelector('.pagedjs_margin-top-center .pagedjs_margin-content');
        const headerRightEl = page.querySelector('.pagedjs_margin-top-right .pagedjs_margin-content');
        
        // Footer elements
        const footerLeftEl = page.querySelector('.pagedjs_margin-bottom-left .pagedjs_margin-content');
        const footerCenterEl = page.querySelector('.pagedjs_margin-bottom-center .pagedjs_margin-content');
        const footerRightEl = page.querySelector('.pagedjs_margin-bottom-right .pagedjs_margin-content');
        
        const pageNum = index + 1;
        
        // Set headers
        if (headerLeftEl) headerLeftEl.textContent = headerLeft;
        if (headerCenterEl) headerCenterEl.textContent = headerMiddle;
        if (headerRightEl) headerRightEl.textContent = headerRight;
        
        // Set footers based on page number position
        if (pageNumPosition === 'right') {
          // Page number always on right - footer-right is replaced by page number
          if (footerLeftEl) footerLeftEl.textContent = footerLeft;
          if (footerCenterEl) footerCenterEl.textContent = footerMiddle;
          if (footerRightEl) {
            footerRightEl.textContent = pageNum;
            footerRightEl.style.fontWeight = '600';
            footerRightEl.style.fontSize = '10pt';
            footerRightEl.style.color = '#2c3e50';
          }
        } else if (pageNumPosition === 'alternate') {
          // Book-style: alternate page number position
          if (pageNum % 2 === 0) {
            // Even pages: page number on LEFT - footer-left is replaced
            if (footerLeftEl) {
              footerLeftEl.textContent = pageNum;
              footerLeftEl.style.fontWeight = '600';
              footerLeftEl.style.fontSize = '10pt';
              footerLeftEl.style.color = '#2c3e50';
            }
            if (footerCenterEl) footerCenterEl.textContent = footerMiddle;
            if (footerRightEl) {
              footerRightEl.textContent = footerRight;
              footerRightEl.style.fontWeight = 'normal';
              footerRightEl.style.fontSize = '8pt';
              footerRightEl.style.color = '#7f8c8d';
            }
          } else {
            // Odd pages: page number on RIGHT - footer-right is replaced
            if (footerLeftEl) {
              footerLeftEl.textContent = footerLeft;
              footerLeftEl.style.fontWeight = 'normal';
              footerLeftEl.style.fontSize = '8pt';
              footerLeftEl.style.color = '#7f8c8d';
            }
            if (footerCenterEl) footerCenterEl.textContent = footerMiddle;
            if (footerRightEl) {
              footerRightEl.textContent = pageNum;
              footerRightEl.style.fontWeight = '600';
              footerRightEl.style.fontSize = '10pt';
              footerRightEl.style.color = '#2c3e50';
            }
          }
        }
      });

      // ============================================
      // FOOTNOTE PLACEMENT
      // Move footnotes to bottom of their respective pages
      // ============================================
      document.querySelectorAll('.pagedjs_page').forEach(page => {
        const pageContent = page.querySelector('.pagedjs_page_content');
        if (!pageContent) return;
        
        const refs = pageContent.querySelectorAll('sup.footnote-ref');
        if (refs.length === 0) return;
        
        // Hide footer content but keep page number on pages with footnotes
        const footerLeftEl = page.querySelector('.pagedjs_margin-bottom-left .pagedjs_margin-content');
        const footerCenterEl = page.querySelector('.pagedjs_margin-bottom-center .pagedjs_margin-content');
        const footerRightEl = page.querySelector('.pagedjs_margin-bottom-right .pagedjs_margin-content');
        
        // Clear left and center footer, keep right (page number)
        if (footerLeftEl) footerLeftEl.textContent = '';
        if (footerCenterEl) footerCenterEl.textContent = '';
        
        const footnoteArea = document.createElement('div');
        footnoteArea.className = 'page-footnotes';
        
        refs.forEach(ref => {
          const fnId = ref.getAttribute('data-fn-id');
          const originalFn = document.querySelector('span.footnote-hidden[data-fn-id="' + fnId + '"]');
          if (originalFn) {
            const fnContent = originalFn.getAttribute('data-fn-content');
            const fnItem = document.createElement('div');
            fnItem.className = 'footnote-item';
            fnItem.innerHTML = '<sup>' + fnId + '</sup> ' + fnContent;
            footnoteArea.appendChild(fnItem);
          }
        });
        
        if (footnoteArea.children.length > 0) {
          const area = page.querySelector('.pagedjs_area');
          if (area) {
            area.appendChild(footnoteArea);
          }
        }
      });
    } catch (e) {
      console.error('After hook error:', e);
    }

    // ============================================
    // SECTION NUMBERING via JavaScript (more reliable than CSS counters)
    // ============================================
    
    // Step 1: Number ALL headings in the document first
    let h1Num = 0, h2Num = 0, h3Num = 0;
    const headingNumbers = new Map(); // Store numbers for each heading ID
    
    // Find all h1, h2, h3 elements (skip TOC, front-page, section-break)
    document.querySelectorAll('h1, h2, h3').forEach(heading => {
      // Skip headings in TOC
      if (heading.closest('.toc') || heading.closest('#TOC')) {
        return;
      }
      // Skip headings in front-page
      if (heading.closest('.front-page')) {
        return;
      }

      // Skip if already numbered
      if (heading.querySelector('.heading-number')) {
        return;
      }
      
      const tag = heading.tagName.toLowerCase();
      
      // Get section ID from parent .section element
      const section = heading.closest('.section');
      const sectionId = section ? section.id : null;
      
      // Also check for data-id (paged.js cloned elements) or heading's own id
      const headingId = heading.id;
      const dataId = heading.getAttribute('data-id') || (section ? section.getAttribute('data-id') : null);
      
      let numberStr = '';
      
      if (tag === 'h1') {
        h1Num++;
        h2Num = 0;
        h3Num = 0;
        numberStr = h1Num + '.';
        heading.insertAdjacentHTML('afterBegin', '<span class="heading-number">' + numberStr + '&#160;</span>');
      } else if (tag === 'h2') {
        h2Num++;
        h3Num = 0;
        numberStr = h1Num + '.' + h2Num;
        heading.insertAdjacentHTML('afterBegin', '<span class="heading-number">' + numberStr + '&#160;</span>');
      } else if (tag === 'h3') {
        h3Num++;
        numberStr = h1Num + '.' + h2Num + '.' + h3Num;
        heading.insertAdjacentHTML('afterBegin', '<span class="heading-number">' + numberStr + '&#160;</span>');
      }
      
      // Store the number for all possible IDs
      if (sectionId) {
        headingNumbers.set(sectionId, numberStr);
      }
      if (headingId && headingId !== sectionId) {
        headingNumbers.set(headingId, numberStr);
      }
      if (dataId && dataId !== sectionId && dataId !== headingId) {
        headingNumbers.set(dataId, numberStr);
      }
    });
    
    // Step 2: Copy heading numbers to TOC items
    const tocLis = document.querySelectorAll('.toc li, #TOC li');
    
    tocLis.forEach(li => {
      const link = li.querySelector('a[href^="#"]');
      if (!link || link.querySelector('.toc-num')) return;
      
      const href = link.getAttribute('href');
      if (!href || !href.startsWith('#')) return;
      
      const targetId = href.substring(1);
      let numberStr = headingNumbers.get(targetId);
      
      // If not found, try to find the element and get its number from heading-number span
      if (!numberStr) {
        const target = document.getElementById(targetId);
        if (target) {
          // Check if target is a heading
          let heading = target;
          if (!['H1', 'H2', 'H3'].includes(target.tagName)) {
            // Look for heading inside
            heading = target.querySelector('h1, h2, h3');
          }
          if (heading) {
            const numSpan = heading.querySelector('.heading-number');
            if (numSpan) {
              numberStr = numSpan.textContent.trim().replace(/\u00A0/g, '');
            }
          }
        }
      }
      
      if (numberStr) {
        link.insertAdjacentHTML('afterBegin', '<span class="toc-num">' + numberStr + '&#160;</span>');
      }
    });
    
    // ============================================
    // COUNTER RESET CLEANUP
    // ============================================
    document.querySelectorAll('[data-counter-page-reset]').forEach(el => {
      el.removeAttribute('data-counter-page-reset');
      el.style.counterReset = 'none';
    });
    document.querySelectorAll('[data-counter-reset]').forEach(el => {
      const val = el.getAttribute('data-counter-reset');
      if (val && val.indexOf('page') === 0) {
        el.removeAttribute('data-counter-reset');
        el.style.counterReset = 'none';
      }
    });

    Array.from(document.styleSheets).forEach(sheet => {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { return; }
      for (let i = rules.length - 1; i >= 0; i -= 1) {
        const text = rules[i].cssText || '';
        if (text.indexOf('counter-reset: page') !== -1) {
          sheet.deleteRule(i);
        }
      }
    });

    document.querySelectorAll('[data-page-number]').forEach(el => {
      el.removeAttribute('data-page-number');
      el.style.counterReset = 'none';
    });

    document.querySelectorAll('.pagedjs_page, .pagedjs_pagebox, .pagedjs_page_content').forEach(el => {
      el.style.counterReset = 'none';
    });
  };
})();
</script>
